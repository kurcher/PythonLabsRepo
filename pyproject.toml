[project]
name = "findex"
version = "0.4.0"
description = "A full-text search engine over a corpus you choose"
readme = "README.md"
license = "MIT"
keywords = ["search", "inverted-index", "bm25", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
]
authors = [
    { name = "Yurii_Murai", email = "kurch2950@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
findex = "findex.cli:app"

[project.urls]
Repository = "https://github.com/kurcher/PythonLabsRepo"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text and typographic apostrophes are intentional

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: takes more than a second"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
