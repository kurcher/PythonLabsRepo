[project]
name = "findex"
version = "0.1.0"
description = "A full-text search engine over a corpus you choose"
readme = "README.md"
authors = [
    { name = "Yurii_Murai", email = "kurch2950@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text and typographic apostrophes are intentional
